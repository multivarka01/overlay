button.pri{background:var(--text);background-image:none;color:#0a0a0b;border-color:transparent;box-shadow:none}button.pri:hover{background:#fff}
#bar button:hover,#top button:hover{transform:none}
:focus-visible{outline:2px solid var(--accL);outline-offset:2px}
#zone{box-shadow:none}#zone span{font-weight:500}
.brand .dot,#st.live i{box-shadow:none}#st.live i{background:var(--ok)}
#aBg.on,#scn .sc.on,.chi.on{background:rgba(255,255,255,.08);border-color:var(--line2)}.ly.on{background:rgba(255,255,255,.07);outline:1px solid var(--line2)}
.lm{display:none}
#brand{left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;padding:6px 14px 6px 10px;border-radius:14px;color:var(--text);text-decoration:none;transition:background-color .15s var(--ease),border-color .15s var(--ease)}#brand:hover{background:var(--hi);border-color:var(--line2)}#brand img{display:block;height:28px;width:auto}
.alogo{width:auto;height:48px;background:none;box-shadow:none;border-radius:0;display:block}.alogo img{display:block;height:48px;width:auto}
#hint{top:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:18px;max-width:calc(50vw - 390px);color:var(--faint);line-height:20px}
@media(max-width:1300px){#hint{display:none}}
kbd{font:500 11px/16px 'JetBrains Mono',ui-monospace,monospace;padding:0 6px;border:1px solid var(--line2);border-radius:4px;background:var(--hi);color:var(--mute)}
#chs{background:rgba(8,8,10,.82)}
#mn{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:none;animation:pop .2s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
#mnH{justify-content:space-between}#mnT{font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.01em}#mnT .w{color:var(--text)}#mnT .g{color:var(--mute)}
.lb{font-size:12px;line-height:16px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.cc{width:128px}.cc .av{width:128px;height:128px;border-radius:12px;background:#1b1b1f!important;border:1px solid var(--line);font-size:40px;font-weight:500;color:var(--mute)}
.cc:hover .av{transform:none;box-shadow:none;background:#202025!important}.cc.on .av{box-shadow:none;border-color:var(--text)}
.cc .nm{font-size:13px;font-weight:500;color:var(--text);text-shadow:none}
.cc .bd{top:8px;left:8px;transform:none;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.08);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
.cc .rm{border-radius:6px}.cc.add .av{background:transparent!important;border:1px dashed var(--line2);font-size:28px;color:var(--faint)}
#lgo{background:var(--hi);background-image:none;border:1px solid var(--line);color:var(--text);font-weight:500}
.pill{border-radius:8px;font-weight:500}.pill.blue{background:var(--hi);border-color:var(--line)}
#toast{border-radius:8px;font-weight:500}
#tour{position:fixed;inset:0;z-index:120}#tour[hidden]{display:none}
#tSp{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.64);border:1px solid var(--line2);pointer-events:none;transition:left .25s var(--ease),top .25s var(--ease),width .25s var(--ease),height .25s var(--ease)}
#tCard{position:absolute;width:320px;max-width:calc(100vw - 24px);padding:20px;border-radius:14px;background:var(--panel);border:1px solid var(--line2)}
#tN{margin:0;font:400 12px/16px 'JetBrains Mono',ui-monospace,monospace;color:var(--faint)}#tT{margin:8px 0 0;font-size:18px;line-height:24px;font-weight:500}#tD{margin:8px 0 0;font-size:14px;line-height:22px;color:var(--mute)}
#tB{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px}#tB span{display:flex;gap:8px}#tSkip{background:none;border:0;padding:8px 0;color:var(--mute)}#tSkip:hover{background:none;color:var(--text)}
#cp{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;background:rgba(8,8,10,.82)}#cp[hidden]{display:none}
#cpC{width:min(360px,calc(100% - 24px));padding:20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
#cpC h3{margin:0;font-size:18px;line-height:24px;font-weight:500}#cpC p{margin:0;font-size:14px;line-height:22px;color:var(--mute)}
#cpL{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}#cpL button,#cpX{text-align:left;padding:10px 12px;background:var(--hi);border:1px solid var(--line)}
.cc .lk2{margin-top:2px;padding:4px 8px;font-size:12px;background:none;border:1px solid var(--line);color:var(--mute)}.cc .lk2:hover{color:var(--text)}

#panel{width:288px;padding:0;gap:0;max-height:calc(100% - 150px)}
#fields{display:flex;flex-direction:column}
.pg{padding:14px 16px;border-bottom:1px solid var(--line)}.pg h4{margin:0 0 12px;font:500 12px/16px Manrope,sans-serif;color:var(--faint)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px}
#fields label{display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:12px;line-height:16px}
#fields .pgrid label{grid-column:auto}#fields .pgrid label[data-span="2"]{grid-column:1/3}
.lt{display:flex;justify-content:space-between;gap:8px}.lt output{color:var(--text);font:400 11px/16px 'JetBrains Mono',ui-monospace,monospace}
#fields input[type=number],#fields input[type=text],#fields select{height:32px;padding:0 10px;background:var(--hi);border:1px solid var(--line);border-radius:8px;color:var(--text);font:400 13px Manrope,sans-serif}
#fields textarea{padding:8px 10px;background:var(--hi);border:1px solid var(--line);border-radius:8px;color:var(--text);font:400 13px/20px Manrope,sans-serif;resize:vertical;min-height:56px}
#fields input[type=color]{width:100%;height:32px;padding:3px;background:var(--hi);border:1px solid var(--line);border-radius:8px}
#fields input[type=range]{height:16px;accent-color:#ededef}
.acts{display:flex;flex-direction:column;gap:8px;padding:14px 16px}.acts .row button{padding:8px 4px;font-size:13px}
#fDel{width:100%;padding:8px;color:var(--accL);background:none;border:1px solid var(--line)}#fDel:hover{background:rgba(242,107,107,.1)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--hi)}.seg button{flex:1;padding:6px 8px;background:none;border:0;color:var(--mute)}.seg button.on{background:var(--text);color:#0a0a0b}
#curWs{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--hi);border:1px solid var(--line);padding:6px 10px}
.cc .av{position:relative;overflow:hidden}.cc .avi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.cc .av.hasimg{font-size:0}
.cc .nm{left:0;right:0;bottom:0;padding:24px 8px 8px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);text-shadow:none}
.cc .bd{z-index:1}.cc .rm{z-index:1}.cc .lk2{width:100%;margin-top:6px}
.cc{cursor:pointer}
.ic{width:1em;height:1em;flex:none;vertical-align:middle}</style>

async function copyLink(k){

  const cur0=k===wsOf(),row=await ensureRow(k,cur0?packCur():(WSMAP[k]?packWS(WSMAP[k]):[]),false);if(!row)return;

}
async function copyToWS(it,k){
  const clone=JSON.parse(JSON.stringify(it));clone.id=uid();
  if(k===wsOf()){items.push(clone);commit();toast('Элемент скопирован');return true}
  let ws=WSMAP[k]||newWS();
  if(sess&&!DEMO&&ROWS[k]){
    const f=await getSB().from('scenes').select('data').eq('id',ROWS[k].id).single();
    if(f.data){const u=unpackWS(f.data.data);if(u.list)ws={list:u.list,active:u.active};else activeOf(ws).items=u.its}
  }
  const a=activeOf(ws);a.items=[...a.items,clone].slice(0,200);WSMAP[k]=ws;saveScenes();
  if(sess&&!DEMO){const row=await ensureRow(k,packWS(ws),false);if(!row)return false;await doSave(k,packWS(ws))}
  toast('Элемент скопирован стримеру '+k);return true;
}
  function openCh(){

  async function connectEditor(){
    const sb=getSB();if(!sb){setStatus(false);showAuth('Не загрузился модуль входа. Проверьте интернет и перезапустите.');return}
    try{
      const r=await sb.auth.getSession();sess=r.data.session;if(!sess)sess=await restoreSession(sb);$('#lgo').style.display=sess?'':'none';
      if(!sess){setStatus(false);showAuth();return}
      $('#auth').hidden=true;
      if(Q.get('next')==='app'){location.replace('app.html');return}
      const tw=((sess.user.user_metadata||{}).preferred_username||'').toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,25);
      WSK=WSK||curCh||myLogin||tw||'main';
      if(!(await loadRows(sb))){toast('Не удалось открыть сцену');return}
      await enterWS(WSK);
      const ds=(Q.get('s')||'').toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,25),da=Q.get('add')||'';
      if(ds&&ds!==wsOf()){if(ds!==myLogin&&!chs.includes(ds)){chs.push(ds);saveCh()}pick(ds)}
      const tm={text:'#aText',timer:'#aWd','7tv':'#a7',web:'#aWeb',twitch:'#aTw'};
      if(tm[da])setTimeout(()=>{const b=$(tm[da]);if(b)b.click()},900);
      if(ds||da){try{history.replaceState(null,'',location.pathname)}catch(e){}}
      if(!da)setTimeout(()=>startTour(false),600);
    }catch(e){setStatus(false)}
  }
  const setAuErr=(m,ok)=>{const e=$('#auErr');e.textContent=m||'';e.classList.toggle('ok',!!ok)};
  const setBusy=b=>{const t=$('#auTw');t.disabled=b;t.classList.toggle('ld',b);t.setAttribute('aria-busy',b?'true':'false');$('#auTwT').textContent=b?'Открываю Twitch…':'Продолжить с Twitch'};
  function showAuth(msg){$('#auth').hidden=false;$('#auBr').hidden=!window.__TAURI_INTERNALS__;if(msg)setAuErr(msg);const b=$('#auTw');if(b&&!b.disabled){try{b.focus({preventScroll:true})}catch(e){}}}
  function parseAuthError(search,hash){
    const r={msg:'',search:search||'',hash:hash||''},K=['error','error_code','error_description'];
    const parts=[['search',new URLSearchParams(search||'')],['hash',new URLSearchParams((hash||'').replace(/^#/,''))]];
    let err='',desc='';
    for(const [n,p] of parts){
      if(!K.some(k=>p.has(k)))continue;
      err=err||p.get('error')||'';desc=desc||p.get('error_description')||'';
      K.forEach(k=>p.delete(k));
      const t=p.toString();r[n]=t?(n==='search'?'?':'#')+t:'';
    }
    if(err||desc)r.msg=err==='access_denied'?'Вход отменён':'Не удалось войти: '+String(desc||err).slice(0,200);
    return r;
  }
  (function(){const r=parseAuthError(location.search,location.hash);if(!r.msg)return;
    try{history.replaceState(null,'',location.pathname+r.search+r.hash)}catch(e){}
    showAuth(r.msg)})();
  addEventListener('pageshow',ev=>{if(ev.persisted)setBusy(false)});
  const REDIR='http://127.0.0.1:53682/callback';
  const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  $('#auBr').onclick=async()=>{
    const inv=window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.invoke,sb=getSB();
    if(!inv){setAuErr('Эта кнопка работает только в приложении.');return}
    if(!OAUTH_CLIENT_ID){setAuErr('Приложение ещё не зарегистрировано в Supabase (OAUTH_CLIENT_ID пуст).');return}
    if(!sb){setAuErr('Не загрузился модуль входа.');return}
    $('#auBr').disabled=true;
    try{
      const rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
      const verifier=rnd(48),state=rnd(16);
      const challenge=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
      const url=SB_URL+'/auth/v1/oauth/authorize?'+new URLSearchParams({response_type:'code',client_id:OAUTH_CLIENT_ID,redirect_uri:REDIR,state,code_challenge:challenge,code_challenge_method:'S256',scope:'email'});
      setAuErr('Подтвердите вход в браузере…',true);
      const q=new URLSearchParams(await inv('browser_login',{url}));
      if(q.get('error')){setAuErr(q.get('error')==='access_denied'?'Вход отменён':'Ошибка: '+q.get('error'));return}
      if(q.get('state')!==state||!q.get('code')){setAuErr('Ответ не прошёл проверку. Повторите вход.');return}
      const resp=await fetch(SB_URL+'/auth/v1/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({grant_type:'authorization_code',code:q.get('code'),client_id:OAUTH_CLIENT_ID,redirect_uri:REDIR,code_verifier:verifier})});
      const t=await resp.json();
      if(!resp.ok||!t.access_token){setAuErr('Не удалось завершить вход: '+(t.error_description||t.error||resp.status));return}
      setAM('oauth');const r=await sb.auth.setSession({access_token:t.access_token,refresh_token:t.refresh_token});
      if(r.error){setAuErr(r.error.message);return}
      await connectEditor();
    }catch(e){setAuErr('Не удалось войти: '+((e&&e.message)||e))}
    finally{$('#auBr').disabled=false}
  };
  $('#auTw').onclick=async()=>{
    const sb=getSB();if(!sb){setAuErr('Не загрузился модуль входа. Проверьте интернет.');return}

      const r=await sb.auth.signInWithOAuth({provider:'twitch',options:{redirectTo:location.origin+location.pathname}});

  };

  const mv=d=>act(i=>{const a=items.indexOf(i),b=a+d;if(b>=0&&b<items.length){items.splice(a,1);items.splice(b,0,i)}});
