<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд · Stream Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09090b;--side:#141417;--card:#1d1d21;--hov:#26262b;--a:#df3939;--a2:#e56060;--t:#fff;--t2:#d4d4d8;--t3:#a1a1aa;--t4:#8a8a93}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);display:flex;-webkit-font-smoothing:antialiased}
button,a{font-family:inherit;color:inherit;text-decoration:none}
aside{width:308px;flex:none;background:var(--side);padding:20px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.04)}
.box{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border:0;border-radius:16px;background:var(--hov);cursor:pointer;text-align:left}
.box b{display:block;font-size:14px;font-weight:600}.box small{display:block;font-size:11px;color:var(--t4)}
.box .ic{width:32px;height:32px;border-radius:10px;background:#2f2f35;display:grid;place-items:center;color:var(--t3)}
.box .sp{margin-left:auto;color:var(--t4)}
.grp{margin-top:8px}
.gh{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;border:0;background:none;font-size:13px;font-weight:700;color:var(--t2);cursor:pointer}
.gh svg{transition:transform .2s}.grp.closed .gh svg{transform:rotate(-90deg)}.grp.closed .items{display:none}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:14px;background:none;font-size:15px;font-weight:600;color:var(--t2);cursor:pointer;text-align:left;transition:background .15s}
.it:hover{background:var(--hov)}.it.on{color:#ef4444;background:rgba(223,57,57,.08)}
.it svg{flex:none;width:20px;height:20px}
.grow{flex:1}
.dl{width:100%;padding:14px;border:0;border-radius:16px;background:var(--hov);color:var(--t3);font-size:15px;font-weight:600;cursor:pointer;margin-top:12px}.dl:hover{color:#fff}
.me{margin-top:8px}.me img{width:32px;height:32px;border-radius:50%;background:#333}
.tag{margin-left:4px;padding:2px 8px;border-radius:8px;background:rgba(223,57,57,.2);color:#ef4444;font-size:11px;font-weight:600}
main{flex:1;min-width:0;overflow-y:auto;padding:36px 28px 60px;background:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(160,30,30,.35),transparent),var(--bg)}
.in{max-width:1232px;margin:0 auto}
h1{margin:0 0 24px;font:700 26px Manrope,sans-serif;color:var(--t3)}h1 b{color:#fff}
.g2{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.c{border-radius:28px;background:rgba(32,32,36,.85);border:1px solid rgba(255,255,255,.04);padding:32px;min-height:240px;display:flex;flex-direction:column}
.c.ctr{align-items:center;justify-content:center;text-align:center}
.pill{padding:4px 10px;border-radius:8px;background:#2a2a2f;color:var(--t3);font-size:12px;font-weight:600}
.c h2{margin:12px 0 0;font:700 24px Manrope,sans-serif}.c p{margin:8px 0 0;font-size:14px;color:var(--t3)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 18px;border:0;border-radius:12px;background:linear-gradient(var(--a2),var(--a));font-weight:600;font-size:14px;cursor:pointer}
.ico{width:48px;height:48px;border-radius:14px;background:rgba(223,57,57,.15);display:grid;place-items:center;color:#ef4444}
.mid{max-width:512px;margin:72px auto 0}
.list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
a.c{min-height:160px;transition:background .15s}a.c:hover{background:rgba(44,44,50,.95)}
@media(max-width:900px){aside{display:none}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="side"></aside>
<main><div class="in" id="view"></div></main>

<script>
const I={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 stat:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 15l4-4 3 3 3-4"/>',
 ovl:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
 cloud:'<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 tts:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10h.01M15 10h.01M9 15c2 1.5 4 1.5 6 0"/>',
 tool:'<path d="M14 6a4 4 0 0 0-5 5l-6 6 3 3 6-6a4 4 0 0 0 5-5l-3 3-2-2z"/>',
 bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',
 wifi:'<path d="M5 12a10 10 0 0 1 14 0M8 15a6 6 0 0 1 8 0M12 19h.01"/>'
};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const chev='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';

// Меню: href — переход на другую страницу, иначе внутренний раздел
const MENU=[
 {t:'Дашборд',open:true,items:[
  {id:'home',n:'Главная',i:'home'},
  {id:'stats',n:'Статистика',i:'stat'},
  {id:'overlays',n:'Оверлеи',i:'ovl'},
  {id:'obs',n:'Облачный OBS',i:'cloud'}]},
 {t:'Виджеты',open:true,items:[
  {id:'chat',n:'Чат',i:'chat'},
  {id:'viewers',n:'Счётчик зрителей',i:'eye'},
  {id:'tts',n:'TTS',i:'tts'}]},
 {t:'Инструменты',open:false,items:[{id:'studio',n:'Студия',i:'ovl',href:'studio.html'}]},
 {t:'Бот',open:false,items:[{id:'bot',n:'Настройки бота',i:'bot'}]}
];

// Содержимое разделов. Для «Оверлеев» — карточки-пункты, ведущие в студию.
const SECTIONS={
 overlays:{title:'Оверлеи',cards:[
  {n:'Открыть студию',d:'Полотно, сцены, 7TV и источник «Браузер»',href:'studio.html'},
  {n:'Демо',d:'Посмотреть студию без входа',href:'studio.html?demo=1'}]},
 obs:{title:'Облачный OBS',soon:true},
 stats:{title:'Статистика',soon:true},
 chat:{title:'Чат',soon:true},
 viewers:{title:'Счётчик зрителей',soon:true},
 tts:{title:'TTS',soon:true},
 bot:{title:'Бот',soon:true}
};

const side=document.getElementById('side'),view=document.getElementById('view');
let cur=(location.hash||'#home').slice(1);

function renderSide(){
 side.innerHTML=`
 <button class="box"><span class="ic">${svg('wifi')}</span><span><b>Каналы отсутствуют</b><small>Оффлайн</small></span><span class="sp">${chev}</span></button>
 ${MENU.map((g,gi)=>`<div class="grp ${g.open?'':'closed'}" data-g="${gi}">
  <button class="gh" data-toggle="${gi}">${g.t}${chev}</button>
  <div class="items">${g.items.map(x=>
   x.href?`<a class="it" href="${x.href}">${svg(x.i)}${x.n}</a>`
         :`<button class="it ${cur===x.id?'on':''}" data-go="${x.id}">${svg(x.i)}${x.n}</button>`).join('')}</div></div>`).join('')}
 <div class="grow"></div>
 <button class="dl">Скачать OBS Plugin</button>
 <button class="box me"><img alt=""><b id="uname">themultivarka</b><span class="tag">Автор</span><span class="sp">${chev}</span></button>`;
}

function renderView(){
 if(cur==='home'){
  view.innerHTML=`<h1>Добрый вечер, <b id="hello">themultivarka</b></h1>
  <div class="g2">
   <div class="c ctr"><span class="pill">Тариф Старт</span><h2>Вам доступен весь базовый функционал</h2><div><button class="btn">⚡ Повысить тариф</button></div></div>
   <div class="c" style="justify-content:space-between"><div class="ico">${svg('wifi')}</div><div><h2>Стример не выбран</h2><p>Выберите стримера в боковой панели, чтобы открыть его дашборд.</p></div></div>
  </div>
  <div class="c ctr mid"><div class="ico" style="margin-bottom:16px">${svg('wifi')}</div><h2 style="font-size:18px;margin:0">Стример не выбран</h2><p>Выберите стримера в боковой панели, чтобы открыть его дашборд.</p></div>`;
  return;
 }
 const s=SECTIONS[cur]||{title:'Раздел',soon:true};
 view.innerHTML=`<h1><b>${s.title}</b></h1>`+(s.cards
  ?`<div class="list">${s.cards.map(c=>`<a class="c" href="${c.href}"><h2 style="margin-top:0">${c.n}</h2><p>${c.d}</p></a>`).join('')}</div>`
  :`<div class="c ctr" style="max-width:512px;margin:48px auto 0"><h2 style="font-size:18px;margin:0">Скоро здесь</h2><p>Этот раздел ещё в разработке.</p></div>`);
}

function go(id){cur=id;history.replaceState(null,'','#'+id);renderSide();renderView()}
side.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
 const t=e.target.closest('[data-toggle]');if(t){MENU[+t.dataset.toggle].open=!MENU[+t.dataset.toggle].open;renderSide()}
});
window.addEventListener('hashchange',()=>go((location.hash||'#home').slice(1)));
renderSide();renderView();
</script>
</body>
</html>
