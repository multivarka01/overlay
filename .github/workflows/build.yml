name: Build and release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['launcher/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Set version from run number
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          $p = "launcher/src-tauri/tauri.conf.json"
          (Get-Content $p -Raw) -replace '"version": "[^"]*"', ('"version": "' + $v + '"') | Set-Content $p -NoNewline
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm install
        working-directory: launcher
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          tagName: v__VERSION__
          releaseName: Overlay Studio v__VERSION__
          releaseBody: Установщик для Windows. Приложение обновляется само при запуске.
          releaseDraft: false
          prerelease: false
      - name: Stable installer name for the site button
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Overlay-Studio-Setup.exe
          gh release upload "v$env:APP_VERSION" Overlay-Studio-Setup.exe --clobber
