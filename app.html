      };
      document.addEventListener('keydown',kd,true);
      ov.addEventListener('mousedown',e=>{down=e.target===ov});
      ov.addEventListener('click',e=>{if(down&&e.target===ov)close(o.none)});
      cb.addEventListener('click',()=>close(o.none));
      ok.addEventListener('click',()=>o.onOk({close,inp,er,ok}));
      active=d;document.body.append(ov);app.inert=true;
      requestAnimationFrame(()=>ov.classList.add('on'));
      if(inp){inp.focus();inp.select()}else(o.danger?cb:ok).focus();
    });
  }
  const run=o=>{const p=q.then(()=>show(o));q=p.catch(()=>{});return p};
  return{
    prompt:o=>run({title:o.title,text:o.text,field:{value:o.value,placeholder:o.placeholder},confirm:o.confirm||'Добавить',none:null,
      onOk:({close,inp,er})=>{const v=inp.value.trim(),m=o.validate?o.validate(v):'';if(m){er.textContent=m;inp.setAttribute('aria-invalid','true');inp.focus();return}close(v)}}),
    confirm:o=>run({title:o.title,text:o.text,confirm:o.confirm||'Подтвердить',danger:!!o.danger,none:false,onOk:({close})=>close(true)}),
    copy:o=>run({title:o.title,text:o.text,field:{value:o.value,readonly:true},confirm:'Копировать',cancel:'Закрыть',none:undefined,
      onOk:({inp,er,ok})=>{inp.focus();inp.select();er.textContent='';
        (navigator.clipboard?navigator.clipboard.writeText(inp.value):Promise.reject()).then(()=>{ok.textContent='Скопировано';toast('Ссылка скопирована')},()=>{let c=false;try{c=document.execCommand('copy')}catch(e){}
          if(c){ok.textContent='Скопировано'}else er.textContent='Не удалось скопировать автоматически: нажмите Ctrl+C'})}}),
    get open(){return!!active}
  };
})();
const S={user:null,name:'',own:'',list:[],sel:'',rows:{}};
const base=location.origin+location.pathname.replace(/[^/]*$/,'');
function build(){
  const set=[],hid=hidGet();const add=n=>{if(n&&n!=='main'&&n!=='Основная'&&!hid.includes(n)&&!set.includes(n))set.push(n)};
  add(S.own);chsGet().forEach(add);Object.keys(S.rows).forEach(add);S.list=set;
  if(!S.list.includes(S.sel))S.sel=lsg('hs-dash-s')&&S.list.includes(lsg('hs-dash-s'))?lsg('hs-dash-s'):(S.list.includes(lsg('hs-wk'))?lsg('hs-wk'):S.list[0]||'');
}
function pick(n){S.sel=n;lss('hs-dash-s',n);renderAll()}
async function addStreamer(){
  const v=await modal.prompt({title:'Добавить стримера',text:'Ник Twitch-канала',placeholder:'например, shroud',confirm:'Добавить',
    validate:v=>{const n=normNick(v);return !n?'Введите ник канала':NICK.test(n)?'':'Только латиница, цифры и «_», не длиннее 25 символов'}});
  if(v==null)return;const n=normNick(v);if(!NICK.test(n))return;
  const l=chsGet();if(!l.includes(n)&&n!==S.own){l.push(n);lss('hs-chs',JSON.stringify(l))}
  const h=hidGet();if(h.includes(n))lss('hs-hidden',JSON.stringify(h.filter(x=>x!==n)));
  build();pick(n);
}
const studioUrl=(s,add)=>'studio.html'+(s||add?'?'+[s?'s='+encodeURIComponent(s):'',add?'add='+add:''].filter(Boolean).join('&'):'');
function copyLink(n){
  const r=S.rows[n];if(!r){toast('Ссылка появится после первого открытия студии для этого стримера');return}
  const u=base+'studio.html?o='+r.key;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Ссылка для '+n+' скопирована. Никому её не показывайте'),
    ()=>modal.copy({title:'Ссылка для OBS ('+n+')',text:'Не удалось скопировать автоматически. Скопируйте ссылку вручную и никому её не показывайте.',value:u}));
}
/* delete streamer */
async function delStreamer(n){
  const own=n===S.own,has=!!S.rows[n];
  const text=own
    ?'Это ваш канал, из аккаунта его удалить нельзя, поэтому «'+n+'» будет скрыт из списка. Сцены и ссылка для OBS останутся. Вернуть канал можно через «Добавить стримера».'
    :'Стример «'+n+'» будет удалён из списка.'+(has?' Его сцены и ссылка для OBS тоже будут удалены, старая ссылка перестанет работать.':'');
  const ok=await modal.confirm({title:own?'Скрыть стримера?':'Удалить стримера?',text,confirm:own?'Скрыть':'Удалить',danger:true});
  if(!ok)return;
  const els=$$('[data-n]').filter(e=>e.dataset.n===n&&(e.classList.contains('sc')||e.classList.contains('lr')));els.forEach(e=>e.classList.add('busy'));
  const fail=m=>{els.forEach(e=>e.classList.remove('busy'));toast(m)};
  if(!own&&has){
    if(!sb){fail('Не удалось удалить стримера: нет соединения');return}
    let r;try{r=await sb.from('scenes').delete().eq('name',n).select('id')}catch(e){r={error:e}}
    if(r.error||!(r.data&&r.data.length)){fail('Не удалось удалить сцены стримера. Запись сохранена');return}
    delete S.rows[n];
  }
  if(own){const h=hidGet();if(!h.includes(n)){h.push(n);lss('hs-hidden',JSON.stringify(h))}}
  else lss('hs-chs',JSON.stringify(chsGet().filter(x=>x!==n)));
  if(lsg('hs-dash-s')===n)lsr('hs-dash-s');if(lsg('hs-wk')===n)lsr('hs-wk');
  if(S.sel===n)S.sel='';
  $$('[data-n]').filter(e=>e.dataset.n===n).forEach(e=>{e.classList.remove('busy');e.classList.add('out')});
  wait(()=>{build();renderAll(true);toast(own?'Стример скрыт':'Стример удалён')},260);
}
const pops={selM:'selB',usrM:'usrB'};
function setPop(id,open){const m=$('#'+id),b=$('#'+pops[id]);m.classList.toggle('open',open);b.setAttribute('aria-expanded',open)}
function closePops(focus){let any=false;Object.keys(pops).forEach(id=>{if($('#'+id).classList.contains('open')){any=true;setPop(id,false);if(focus)$('#'+pops[id]).focus()}});return any}
function renderSel(){
  const b=$('#selB');b.replaceChild(avatar(S.sel),b.firstChild);b.firstChild.id='selA';
  $('#selN').textContent=S.sel||'Каналы отсутствуют';$('#selS').textContent=S.sel?'Выбран для студии':'Добавьте стримера';
  const f=document.createDocumentFragment();
  S.list.forEach(n=>{const w=mk('div','pi'+(n===S.sel?' on':''));w.dataset.n=n;
    const x=mk('button','pk');x.type='button';x.dataset.act='pick';x.dataset.n=n;x.append(avatar(n),mk('span',0,n));w.append(x,delBtn(n));f.append(w)});
  const a=mk('button');a.type='button';a.dataset.act='add';a.innerHTML=ico('plus');a.append(mk('span',0,'Добавить стримера'));f.append(a);
  $('#selM').replaceChildren(f);
}
function delBtn(n){const b=mk('button','ib');b.type='button';b.dataset.act='del';b.dataset.n=n;b.title=b.ariaLabel='Удалить стримера';b.setAttribute('aria-label','Удалить стримера');b.innerHTML=ico('trash',16);return b}
function actBtn(cls,txt,act,n){const b=mk('button',cls,txt);b.type='button';b.dataset.act=act;if(n)b.dataset.n=n;return b}
function hello(){const h=new Date().getHours();return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'}
const stag=(e,i)=>{e.style.setProperty('--i',Math.min(i,8));return e};
function pageHome(f){
  const h=mk('h1');h.append(hello()+', ',mk('b',0,S.name));f.append(h);
  const g=mk('div','g2');
  const c1=stag(mk('section','card c1'),0);c1.innerHTML='<span class="chip">Тариф Старт</span><h2>Вам доступен весь базовый функционал</h2>';
  const up=mk('a','bp');up.href='index.html#pricing';up.innerHTML=ico('bolt',16);up.append('Повысить тариф');c1.append(up);
  const c2=stag(mk('section','card c2'),1);
  if(S.sel){
    c2.append(avatar(S.sel),mk('h2',0,S.sel),mk('p',0,'Откройте студию или скопируйте ссылку для OBS'));
    const r=mk('div','rw'),o=mk('a','bp','Открыть студию');o.href=studioUrl(S.sel);
    const dl=actBtn('bs','Удалить стримера','del',S.sel);r.append(o,actBtn('bs','Ссылка для OBS','copy',S.sel),dl);c2.append(r);
  }else{
    const ic=mk('span','ic');ic.innerHTML=ico('cast',20);c2.append(ic,mk('h2',0,'Стример не выбран'),mk('p',0,'Выберите стримера в боковой панели, чтобы открыть студию'));
  }
  g.append(c1,c2);f.append(g,mk('h3','sh','Ваши стримеры'));
  const sg=mk('div','sg');
  S.list.forEach((n,i)=>{const c=stag(mk('div','sc'+(n===S.sel?' on':'')),i+2);c.dataset.n=n;const t=mk('div');t.append(mk('b',0,n),mk('small',0,S.rows[n]?'Есть ссылка для OBS':'Ссылка ещё не создана'));
    const o=mk('a','bs','Открыть студию');o.href=studioUrl(n);c.append(avatar(n),t,o,delBtn(n));sg.append(c)});
  const ad=stag(actBtn('sc add','','add'),S.list.length+2);ad.innerHTML=ico('plus',22);ad.append('Добавить стримера');sg.append(ad);
  f.append(sg);
}
function pageLinks(f){
  f.append(mk('h1',0,'Ссылки для OBS'));
  if(!S.list.length){f.append(mk('p',0,'Сначала добавьте стримера в боковой панели'));return}
  S.list.forEach((n,i)=>{const r=stag(mk('div','lr'),i),t=mk('div','tx');r.dataset.n=n;const has=S.rows[n];
    t.append(mk('b',0,n),mk('small','mono',has?'…?o='+has.key.slice(0,6)+'••••••':'ссылка ещё не создана'));
    const c=actBtn('bs','Копировать','copy',n);c.disabled=!has;
    const o=mk('a','bs','Студия');o.href=studioUrl(n);r.append(avatar(n),t,c,o);f.append(r)});
  const p=mk('p',0,'Ссылка создаётся, когда вы впервые откроете студию для стримера. Добавьте её в OBS как Browser Source 1920×1080.');p.style.cssText='margin-top:16px;color:var(--t3)';f.append(p);
}
function setNv(o){document.body.classList.toggle('nv',o);$('#burger').setAttribute('aria-expanded',o)}
function route(still){
  const r=(location.hash||'#home').slice(1),p=$('#pg'),f=document.createDocumentFragment();
  $$('[data-r]').forEach(a=>{const on=a.dataset.r===r;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  p.classList.toggle('still',!!still);(r==='links'?pageLinks:pageHome)(f);p.replaceChildren(f);setNv(false);
  if(!still&&!RM.matches&&p.animate)p.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,0,0,1)'});
}
function links(){$$('[data-st]').forEach(a=>{a.href=studioUrl(S.sel,a.dataset.st)})}
function renderAll(still){renderSel();links();route(still===true)}
function main(){
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce'}})}catch(e){}
  $$('[data-ic]').forEach(e=>{e.innerHTML=ico(e.dataset.ic,+e.dataset.s||18);e.style.display='inline-flex'});
  $('#selI').innerHTML=ico('updown',16);$('#selI').style.display='inline-flex';
  $$('[data-g]').forEach(b=>b.addEventListener('click',()=>{const s=b.parentElement.classList.toggle('shut');b.setAttribute('aria-expanded',!s)}));
  $('#selB').addEventListener('click',e=>{e.stopPropagation();setPop('usrM',false);setPop('selM',!$('#selM').classList.contains('open'))});
  $('#usrB').addEventListener('click',e=>{e.stopPropagation();setPop('selM',false);setPop('usrM',!$('#usrM').classList.contains('open'))});
  document.addEventListener('click',()=>closePops(false));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.open){if(closePops(true))return;if(document.body.classList.contains('nv')){setNv(false);$('#burger').focus()}}});
  $('#burger').addEventListener('click',e=>{e.stopPropagation();setNv(!document.body.classList.contains('nv'))});
  const onAct=e=>{
    const t=e.target.closest('[data-act]');if(!t)return;const n=t.dataset.n;
    switch(t.dataset.act){
      case'pick':closePops(false);pick(n);break;
      case'add':closePops(false);addStreamer();break;
      case'copy':copyLink(n);break;
      case'del':e.stopPropagation();closePops(false);delStreamer(n);break;
    }
  };
  $('#pg').addEventListener('click',onAct);$('#selM').addEventListener('click',onAct);
  addEventListener('hashchange',()=>route(false));
  if(window.__TAURI_INTERNALS__)$('#dl').style.display='none';
  $('#out').addEventListener('click',async()=>{try{localStorage.removeItem('hs-rt');await sb.auth.signOut()}catch(e){}location.replace('index.html')});
  init();
}
async function init(){
  if(!sb){location.replace('studio.html?next=app');return}
  let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}
  if(!ses){location.replace('studio.html?next=app');return}
  S.user=ses.user;const m=S.user.user_metadata||{};
  S.own=String(m.preferred_username||m.user_name||'').toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,25);
  S.name=m.preferred_username||m.name||m.full_name||(S.user.email||'').split('@')[0]||'гость';
  $('#usrN').textContent=S.name;const ua=avatar(S.name,m.avatar_url||m.picture);$('#usrB').replaceChild(ua,$('#usrB').firstChild);
  try{const r=await sb.from('scenes').select('id,name,overlay_key,updated_at').order('created_at');(r.data||[]).forEach(x=>{S.rows[x.name]={id:x.id,key:x.overlay_key}})}catch(e){}
  build();renderAll();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',main);else main();
})();
</script>
