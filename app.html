  try{const r=await sb.from('scenes').select('id,name,overlay_key,updated_at').order('created_at');(r.data||[]).forEach(x=>{S.rows[x.name]={id:x.id,key:x.overlay_key}})}catch(e){}
  build();renderAll();
}
init();
})();
</script>
