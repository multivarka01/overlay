<style>
/* Motion tokens: one scale for the whole dashboard. Only transform/opacity are animated
   (the two accordions use grid-template-rows on purpose: it is the only way to animate auto height without JS). */
:root{color-scheme:dark;--bg:#0b0b0c;--sb:#161617;--s1:#1d1d1f;--s2:#262628;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--t1:#f2f2f4;--t2:#a8a8b0;--t3:#8a8a94;--ac:#df3939;--act:#f26b6b;
--e:cubic-bezier(.2,0,0,1);--d-fast:.15s;--d-base:.25s;--d-slow:.4s;--stg:45ms}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t1);font:400 14px/20px Manrope,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@keyframes sh{to{transform:translateX(100%)}}
@keyframes bump{from{opacity:0;transform:translateY(4px)}}
#app{display:grid;grid-template-columns:240px 1fr;height:100%}
#sb{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--sb);border-right:1px solid var(--ln);overflow:auto}
.sbt{display:none;align-items:center;justify-content:space-between;gap:8px;padding:0 0 4px 4px;font-weight:700}
.sel{position:relative}.sel>button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px 8px 8px;border:0;border-radius:14px;background:var(--s2);text-align:left;transition:background-color var(--d-fast) var(--e),transform var(--d-fast) var(--e)}
.sel>button:hover{background:#2d2d30}.sel>button:active,.usr:active,.dlb:active{transform:scale(.98)}.sel .tx{flex:1;min-width:0}.sel b{display:block;font-weight:600;font-size:14px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sel small{display:block;font-size:12px;line-height:16px;color:var(--t3)}
.pop{position:absolute;left:0;right:0;z-index:30;display:flex;flex-direction:column;gap:2px;max-height:min(60vh,420px);overflow:auto;padding:6px;background:var(--s2);border:1px solid var(--ln2);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.4);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-4px) scale(.96);transform-origin:top center;transition:opacity var(--d-fast) var(--e),transform var(--d-base) var(--e),visibility 0s var(--d-base)}
.pop.open{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.sel .pop{top:calc(100% + 6px)}.pop button,.pop a{display:flex;align-items:center;gap:10px;padding:8px;border:0;border-radius:10px;background:none;text-align:left;font-weight:500;color:var(--t1);transition:background-color var(--d-fast) var(--e)}.pop button:hover,.pop a:hover{background:rgba(255,255,255,.07)}.pop .on{background:rgba(255,255,255,.07)}
.pi{display:flex;align-items:center;border-radius:10px;transition:opacity var(--d-base) var(--e),transform var(--d-base) var(--e)}.pi .pk{flex:1;min-width:0}.pi .pk span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pop .pi .ib{margin-right:2px}.pop .pi .ib:hover{background:rgba(223,57,57,.16)}
.pi.out,.sc.out,.lr.out{opacity:0;transform:scale(.92);pointer-events:none}
.av{position:relative;flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;overflow:hidden;background:#303033;color:var(--t2);font-weight:600}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.av.has{color:transparent}
.ib{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:8px;background:none;color:var(--t3);transition:background-color var(--d-fast) var(--e),color var(--d-fast) var(--e),transform var(--d-fast) var(--e)}.ib:hover{color:var(--act);background:rgba(223,57,57,.14)}.ib:active{transform:scale(.9)}
.grp{margin-top:8px}.grp>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px;border:0;background:none;font-weight:600;font-size:13px;color:var(--t2)}.grp>button svg{transition:transform var(--d-base) var(--e)}.grp.shut>button svg{transform:rotate(-90deg)}
.gw{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--d-base) var(--e),visibility 0s}.grp.shut .gw{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows var(--d-base) var(--e),visibility 0s var(--d-base)}
.gi{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden;padding:2px;margin:-2px}.gi a{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:10px;font-weight:500;color:var(--t1);transition:background-color var(--d-fast) var(--e),color var(--d-fast) var(--e)}.gi a:hover{background:rgba(255,255,255,.06)}.gi a.on{color:var(--act)}
.sbf{margin-top:auto;display:flex;flex-direction:column;gap:8px;position:relative}
.dlb{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:var(--s2);font-weight:500;color:var(--t2);transition:background-color var(--d-fast) var(--e),color var(--d-fast) var(--e),transform var(--d-fast) var(--e)}.dlb:hover{background:#2d2d30;color:var(--t1)}
.usr{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:14px;background:var(--s2);text-align:left;transition:background-color var(--d-fast) var(--e),transform var(--d-fast) var(--e)}.usr:hover{background:#2d2d30}.usr b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{padding:2px 8px;border-radius:6px;background:rgba(223,57,57,.18);color:var(--act);font-size:12px;line-height:16px;font-weight:500}
.sbf .pop{bottom:calc(100% + 6px);transform-origin:bottom center;transform:translateY(4px) scale(.96)}.sbf .pop.open{transform:none}
#mn{position:relative;overflow:auto;background:radial-gradient(ellipse 70% 38% at 50% -8%,rgba(223,57,57,.22),transparent 70%),var(--bg)}
.mh{display:none;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln)}.mh button{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--s1)}
#bd{display:none}

function wipeAuth(){try{Object.keys(localStorage).filter(k=>/^sb-.*-auth-token(-code-verifier)?$/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}lsr('hs-rt')}
async function logout(btn){
  if(leaving)return;leaving=true;if(btn){btn.disabled=true}
  lsr('hs-rt');
  try{await tmo(sb.auth.signOut(),4000)}catch(e){}
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  wipeAuth();location.replace('index.html');
}
/* redirect loop guard: app.html -> studio.html?next=app -> app.html ... stops after 2 hops per minute */
const LOOPK='hs-loop';
function goLogin(){
  let a=[],okStore=true;
  try{a=JSON.parse(sessionStorage.getItem(LOOPK)||'[]').filter(t=>Date.now()-t<60000)}catch(e){okStore=false}
  if(okStore){try{a.push(Date.now());sessionStorage.setItem(LOOPK,JSON.stringify(a))}catch(e){okStore=false}}
  if(!okStore||a.length>2){
    showFail({title:'Не получается войти',text:'Вход не завершился: страницы входа и панели отправляют друг друга по кругу. Проверьте, что браузер не блокирует cookies и localStorage, и войдите заново.',
      actions:[{cls:'bp',t:'Войти заново',act:'relogin',ic:'logout'},{t:'Повторить',act:'retry-init',ic:'refresh'}]});
    return;
  }
  location.replace('studio.html?next=app');
}
const isNet=e=>!e||e.message==='timeout'||e.name==='AuthRetryableFetchError'||e.name==='TypeError'||/fetch|network|load failed/i.test(e.message||'')||e.status===0||e.status>=500;
function netFail(){showFail({title:'Не удалось подключиться',text:'Сервер входа не отвечает. Проверьте интернет или попробуйте позже. Ваши данные не потеряны.',actions:[{cls:'bp',t:'Повторить',act:'retry-init',ic:'refresh'},{t:'На сайт',act:'home-site'}]})}
let initBusy=false,authSub=false;
async function init(){
  if(initBusy)return;initBusy=true;
  try{
    if(/[?&]demo(?:[=&]|$)/.test(location.search)){location.replace('studio.html?demo=1');return}
    skeleton();
    if(!sb){showFail({title:'Не загрузился модуль входа',text:'Скрипт Supabase не загрузился с cdn.jsdelivr.net. Проверьте интернет, отключите блокировщик рекламы для этого сайта и повторите.',actions:[{cls:'bp',t:'Перезагрузить страницу',act:'reload',ic:'refresh'}]});return}
    let ses=null,err=null;
    try{const r=await tmo(sb.auth.getSession(),12000);ses=r.data&&r.data.session;err=r.error||null}catch(e){err=e}
    if(!ses){if(err&&isNet(err)||(!err&&navigator.onLine===false))netFail();else goLogin();return}
    try{sessionStorage.removeItem(LOOPK)}catch(e){}
    S.user=ses.user;const m=S.user.user_metadata||{};
    S.own=String(m.preferred_username||m.user_name||'').toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,25);
    S.name=m.preferred_username||m.name||m.full_name||(S.user.email||'').split('@')[0]||'гость';
    $('#usrN').textContent=S.name;
    const ua=avatar(S.name,[m.avatar_url||m.picture,S.own&&'https://unavatar.io/twitch/'+encodeURIComponent(S.own)]);ua.id='usrA';$('#usrB').replaceChild(ua,$('#usrB').firstChild);
    S.ready=true;S.rowsState='loading';build();
    await loadRows();build();renderAll(true);
    if(!authSub){authSub=true;try{sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&!leaving)goLogin()})}catch(e){}}
  }finally{initBusy=false}
}
function main(){
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce'}})}catch(e){}
  $$('[data-ic]').forEach(e=>{e.innerHTML=ico(e.dataset.ic,+e.dataset.s||18);e.style.display='inline-flex'});
  $('#selI').innerHTML=ico('updown',16);$('#selI').style.display='inline-flex';
  $$('[data-g]').forEach(b=>b.addEventListener('click',()=>{const s=b.parentElement.classList.toggle('shut');b.setAttribute('aria-expanded',!s)}));
  $('#selB').onclick=e=>{e.stopPropagation();isOpen('selM')?setPop('selM',false):openPop('selM',0)};
  $('#usrB').onclick=e=>{e.stopPropagation();isOpen('usrM')?setPop('usrM',false):openPop('usrM',0)};
  Object.keys(pops).forEach(id=>{const tb=$('#'+pops[id]),m=$('#'+id);
    tb.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();openPop(id,'first')}else if(e.key==='ArrowUp'){e.preventDefault();openPop(id,'last')}});
    m.addEventListener('keydown',e=>popKeys(id,e));
    m.addEventListener('focusout',e=>{const t=e.relatedTarget;if(t&&!m.contains(t)&&t!==tb)setPop(id,false)});
    m.addEventListener('click',e=>e.stopPropagation());});
  document.addEventListener('click',()=>closePops(false));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.open){if(closePops(true))return;if(document.body.classList.contains('nv'))setNv(false)}});
  $('#burger').addEventListener('click',e=>{e.stopPropagation();setNv(!document.body.classList.contains('nv'))});
  $('#bd').addEventListener('click',()=>setNv(false));$('#sbx').addEventListener('click',()=>setNv(false));
  $('#sb').addEventListener('click',e=>{if(e.target.closest('a[data-r]'))setNv(false)});
  (MQ.addEventListener?MQ.addEventListener('change',()=>setNv(false)):MQ.addListener(()=>setNv(false)));
  setNv(false);
  /* all page and popover clicks go through two delegated listeners, so re-rendering never stacks handlers */
  const onAct=e=>{
    const t=e.target.closest('[data-act]');if(!t)return;const n=t.dataset.n;
    switch(t.dataset.act){
      case'pick':closePops(false);pick(n);$('#selB').focus({preventScroll:true});break;
      case'add':closePops(false);addStreamer();break;
      case'copy':copyLink(n);break;
      case'del':e.stopPropagation();closePops(false);delStreamer(n);break;
      case'retry-rows':retryRows(t);break;
      case'retry-init':init();break;
      case'reload':location.reload();break;
      case'home-site':location.href='index.html';break;
      case'relogin':try{sessionStorage.removeItem(LOOPK)}catch(e){}wipeAuth();location.replace('studio.html?next=app');break;
      case'obs':{const w=t.closest('.hp'),s=w.classList.toggle('shut');t.setAttribute('aria-expanded',!s);lss(OBSK,s?'0':'1');break}
    }
  };
  $('#pg').addEventListener('click',onAct);$('#selM').addEventListener('click',onAct);
  addEventListener('hashchange',()=>route(false));
  if(window.__TAURI_INTERNALS__)$('#dl').style.display='none';
  $('#out').addEventListener('click',e=>logout(e.currentTarget));
  init();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',main);else main();
})();
</script>
