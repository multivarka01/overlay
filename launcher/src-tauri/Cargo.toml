[package]
name = "overlay-studio"
version = "0.2.0"
description = "Stream Overlay launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
webbrowser = "1"
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
